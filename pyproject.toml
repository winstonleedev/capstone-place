[project]
name = "place"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Winston", email = "9567726+winstonleedev@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
place-server = "place:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
