<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>place - Collaborative Pixel Canvas</title>
  <link rel="stylesheet" href="/static/style.css?v=4">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='50' height='50' fill='%23e63946'/><rect x='50' width='50' height='50' fill='%23457b9d'/><rect y='50' width='50' height='50' fill='%232a9d8f'/><rect x='50' y='50' width='50' height='50' fill='%23e9c46a'/></svg>">
</head>
<body>
  <div class="app-layout">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="brand">
        <span class="logo-pixel">http://</span><span class="logo-text">192.168.0.7:8000</span>
        <span class="grid-badge" id="gridSizeBadge">120×70</span>
      </div>

      <div class="stats-group">
        <div class="stat-pill" title="Live Viewers">
          <span class="stat-dot pulse"></span>
          <span id="viewerCount">1</span> viewers
        </div>
        <div class="stat-pill" title="Total Pixels Placed">
          <span class="stat-icon">🖌️</span>
          <span id="totalPlaced">0</span> placed
        </div>
        <div class="stat-pill coord-pill" title="Hovered Coordinates">
          <span class="stat-icon">📍</span>
          <span id="coordDisplay">X: --, Y: --</span>
        </div>
      </div>

      <div class="action-buttons">
        <button id="zoomOutBtn" class="btn-secondary" title="Zoom out">−</button>
        <button id="zoomInBtn" class="btn-secondary" title="Zoom in">+</button>
        <button id="toggleGridBtn" class="btn-secondary" title="Toggle pixel grid lines">
          <span class="btn-icon">▦</span> Grid
        </button>
        <button id="downloadBtn" class="btn-secondary" title="Export canvas snapshot as PNG">
          <span class="btn-icon">💾</span> Export
        </button>
      </div>
    </header>

    <!-- Main Canvas Area (Single Screen Fit) -->
    <main class="canvas-viewport" id="viewport">
      <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="boardCanvas" width="96" height="64"></canvas>
        <canvas id="overlayCanvas" width="96" height="64"></canvas>
      </div>
    </main>

    <!-- Bottom Control Bar -->
    <footer class="bottom-bar">
      <!-- Rate Limit & Cooldown Meter -->
      <div class="quota-container" id="quotaContainer">
        <div class="quota-header">
          <span class="quota-label">Rate Limit</span>
          <span class="quota-badge" id="quotaBadge">10 / 10 pixels</span>
        </div>
        <div class="quota-bar-track">
          <div class="quota-bar-fill" id="quotaBarFill" style="width: 100%;"></div>
        </div>
        <div class="cooldown-timer" id="cooldownTimer">Ready to place</div>
      </div>

      <!-- Divider -->
      <div class="bar-divider"></div>

      <!-- Color Controls -->
      <div class="color-controls">
        <div class="current-color-group">
          <label class="color-preview-box" for="nativeColorPicker" title="Click to open color wheel">
            <span class="color-preview-swatch" id="colorPreview"></span>
          </label>
          <input type="color" id="nativeColorPicker" value="#E63946">
          <input type="text" id="hexInput" value="#E63946" maxlength="7" spellcheck="false" title="Hex RGB color">
          <button id="eyedropperBtn" class="btn-icon-only" title="Eyedropper: Pick color from canvas">
            💉
          </button>
        </div>

        <!-- Palette Swatches -->
        <div class="palette-swatches" id="paletteContainer">
          <!-- Populated by JS -->
        </div>
      </div>
    </footer>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="/static/app.js?v=5"></script>
</body>
</html>
